name: Build Cross-Platform Desktop App

on:
  workflow_dispatch:
  push:
    branches: [feat/tauri-react-ui]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKitGTK dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Build PyInstaller sidecar
        shell: bash
        run: |
          python -m pip install pyinstaller
          pyinstaller --noconfirm --clean packaging/ppstudio-backend.spec
          mkdir -p src-tauri/binaries
          TARGET=$(rustc -vV | awk '/host:/ {print $2}')
          if [ "$RUNNER_OS" == "Windows" ]; then
            cp dist/ppstudio-backend.exe "src-tauri/binaries/ppstudio-backend-${TARGET}.exe"
          else
            cp dist/ppstudio-backend "src-tauri/binaries/ppstudio-backend-${TARGET}"
            chmod +x "src-tauri/binaries/ppstudio-backend-${TARGET}"
          fi

      - name: Build Tauri bundle
        run: |
          npm --prefix ui ci
          npm --prefix ui test
          npx --prefix ui tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: ppstudio-${{ matrix.target }}
          path: src-tauri/target/release/bundle/**
